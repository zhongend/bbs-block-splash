# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties（与原版 2.0.4 构建清单一致：MC 1.20.1 / Loader 0.16.14 / Loom 1.15.x）
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14

# Fabric API
fabric_version=0.92.1+1.20.1

# Mod Properties
# 2.2.0：物理时钟改为 BBS 回放时钟驱动 + 客户端插值重写，属行为变更，故升 minor
# 2.2.1：修复与 bbs_physics 同时安装时重复加载 joltjni 导致的 JVM 原生崩溃（hs_err_pid7064）
mod_version=2.5.0
maven_group=com.example
archives_base_name=bbs-Block_Splash

